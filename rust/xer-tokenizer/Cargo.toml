[package]
name = "xer-tokenizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A tokenizer for the Primavera XER file layout, written to be checked against xerlane's Python parser."
license = "MIT"
publish = false

[lib]
name = "xer_tokenizer"
path = "src/lib.rs"

[[bin]]
name = "xer-tokenizer"
path = "src/main.rs"

[profile.release]
opt-level = 3
